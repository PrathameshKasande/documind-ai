[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "Agentic research assistant for multi-document research"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.40",
    "langgraph>=0.2",
    "google-genai>=1.0",
    "huggingface_hub>=0.27",
    "python-dotenv>=1.0",
    "chromadb>=0.6",
    "sentence-transformers>=3.3",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "pydantic>=2.8",
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]